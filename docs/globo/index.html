<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NISAR Anomaly Watch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;700;800&display=swap">
<style>
:root { --space: #02060F; --panel: rgba(10, 22, 52, 0.88); --edge: #2B4C8C; --ink: #E8F0FF; --ink2: #A9BCE0; --cyan: #7FE8FF; --neon: #EAFE07; --sky: #9CC9FA; --blue: #0042A6;
  --display: "Fira Sans", system-ui, sans-serif; --mono: "Fira Code", ui-monospace, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--space); color: var(--ink); font-family: var(--display); overflow: hidden; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#cv.drag { cursor: grabbing; }
nav { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); background: linear-gradient(#02060Fee, #02060F00); pointer-events: none; }
nav > * { pointer-events: auto; }
.brand { font-weight: 800; color: var(--cyan); letter-spacing: .5px; }
.brand small { display: block; font: 500 11px var(--mono); color: var(--ink2); letter-spacing: 2px; }
.ctrl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 999px; overflow: hidden; background: var(--panel); }
.seg button { background: transparent; color: var(--ink2); border: 0; font: 600 13px var(--display); padding: 0 12px; min-height: 36px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--cyan); color: #02122E; }
.hero { transition: opacity .8s ease, transform .8s ease; }
.hero.gone { opacity: 0; transform: translate(-50%, -12px); }
.hero { position: fixed; left: 50%; top: 68px; transform: translateX(-50%); text-align: center; pointer-events: none; width: min(92vw, 720px); }
.hero h1 { margin: 0; font-size: clamp(22px, 3.4vw, 40px); font-weight: 800; color: #9FF0FF; text-shadow: 0 2px 18px #000; }
.hero p { margin: 4px 0 0; color: var(--ink2); font-size: 14px; text-shadow: 0 1px 8px #000; }
.stats { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 28px; pointer-events: none; text-align: center; }
.stats b { display: block; font-size: 26px; color: var(--cyan); font-weight: 800; } .stats span { font-size: 12px; color: var(--ink2); }
.badge { position: fixed; padding: 10px 14px; border: 1px solid var(--edge); border-radius: 10px; background: var(--panel); cursor: pointer; color: var(--ink); font: inherit; text-align: left; display: flex; gap: 10px; align-items: center; }
.badge:hover { border-color: var(--cyan); }
.badge .tag { font: 600 12px var(--mono); color: var(--ink2); }
.badge b { display: block; font-size: 14px; } .badge span { font-size: 12px; color: var(--ink2); }
.badge.star { border-color: var(--neon); box-shadow: 0 0 0 1px var(--neon), 0 0 24px #EAFE0744; }
.badge.star .tag { color: var(--neon); }
#panel { position: fixed; right: max(16px, env(safe-area-inset-right)); top: 76px; width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 100px); overflow: auto;
  background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 16px; display: none; flex-direction: column; gap: 10px; backdrop-filter: blur(6px); }
#panel.on { display: flex; }
#panel.wide { width: min(600px, calc(100vw - 32px)); }
.car { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; gap: 0; border-radius: 10px; }
.car::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: start; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.slide .media { position: relative; background: #000; border-radius: 10px; overflow: hidden; }
.slide .media img, .slide .media canvas { display: block; width: 100%; height: auto; max-height: 46vh; object-fit: contain; background: #fff; image-rendering: auto; }
.slide .media canvas { background: #000; image-rendering: pixelated; }
.slide h3 { margin: 0; font-size: 16px; }
.slide .what { font-size: 14px; line-height: 1.5; margin: 0; }
.slide .how { font-size: 12.5px; line-height: 1.5; margin: 0; color: var(--ink2); border-left: 3px solid var(--cyan); padding-left: 10px; }
.slide .how b { color: var(--cyan); font-weight: 600; }
[hidden] { display: none !important; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #000; }
.duo figure { margin: 0; position: relative; aspect-ratio: 318 / 332; background: #000; }
.duo canvas, .duo img { position: absolute; inset: 0; width: 100% !important; height: 100% !important; max-height: none !important; object-fit: fill !important; image-rendering: pixelated; background: #000; }
.duo figcaption { position: absolute; left: 6px; top: 6px; font: 600 11px var(--mono); background: rgba(2,6,15,.85); padding: 3px 7px; border-radius: 5px; color: var(--ink); }
.vph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 14px; font-size: 12px; color: var(--ink2); background: repeating-linear-gradient(45deg, #0A1A40, #0A1A40 6px, #0C1F4A 6px, #0C1F4A 12px); }
.vbar { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: #050E26; }
.vbar button { min-height: 36px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--neon); color: #02122E; font: 700 13px var(--display); cursor: pointer; }
.vbar .when { font: 600 13px var(--mono); } .vbar .prog { flex: 1; height: 4px; background: rgba(255,255,255,.2); border-radius: 2px; overflow: hidden; } .vbar .prog i { display: block; height: 100%; background: var(--neon); width: 0; }
.pcl { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 10px 10px; background: #050E26; }
.pcl button { font: 600 12px var(--display); min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--edge); background: transparent; color: var(--ink2); cursor: pointer; }
.pcl button[aria-pressed="true"] { background: var(--cyan); color: #02122E; border-color: var(--cyan); }
.vctl { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; gap: 10px; align-items: center; }
.vctl button { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--neon); color: #02122E; font: 700 13px var(--display); cursor: pointer; }
.vctl .when { font: 600 13px var(--mono); background: rgba(2,6,15,.8); padding: 4px 10px; border-radius: 6px; }
.vctl .prog { flex: 1; height: 4px; background: rgba(255,255,255,.25); border-radius: 2px; overflow: hidden; } .vctl .prog i { display: block; height: 100%; background: var(--neon); width: 0; }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nav button.arr { min-width: 42px; min-height: 42px; border-radius: 50%; border: 1px solid var(--edge); background: transparent; color: var(--ink); font-size: 16px; cursor: pointer; }
.nav button.arr:disabled { opacity: .3; cursor: default; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; background: #3A5A94; cursor: pointer; }
.dots button[aria-current="true"] { background: var(--neon); width: 22px; border-radius: 5px; }
.gl { width: 100%; border-collapse: collapse; font-size: 12px; }
.gl th { text-align: left; color: var(--cyan); font: 600 11px var(--mono); padding: 6px; border-bottom: 1px solid var(--edge); }
.gl td { padding: 6px; vertical-align: top; border-bottom: 1px solid #1A2C58; color: var(--ink2); line-height: 1.4; } .gl td b { color: var(--ink); }
.nexts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; background: #050E26; }
.nexts div { background: #0A1A40; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.nexts span { font-size: 20px; } .nexts b { font-size: 13.5px; } .nexts small { font-size: 12px; color: var(--ink2); line-height: 1.4; }
.trio3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } .trio3 .thumb { aspect-ratio: auto; display: flex; flex-direction: column; gap: 4px; background: none; border: 0; padding: 0 !important; place-items: stretch; }
.trio3 canvas { aspect-ratio: 192 / 172; height: auto !important; border-radius: 6px; } .trio3 .cap { position: static; background: none; padding: 0; font-size: 9.5px; color: var(--ink2); }
.thumb .cap { position: absolute; left: 4px; bottom: 4px; right: 4px; font: 600 10px var(--mono); background: rgba(2,6,15,.85); color: var(--ink); padding: 3px 6px; border-radius: 5px; text-align: left; line-height: 1.35; }
.sum { background: #0A1A40; border-left: 3px solid var(--cyan); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 1.5; }
.sum p { margin: 4px 0; } .sum b { color: var(--cyan); font-weight: 600; }
.step { font: 600 11px var(--mono); color: var(--neon); letter-spacing: 1.5px; }
body.paneled .badge[data-go], body.paneled .hero { display: none; }
#panel h2 { margin: 0; font-size: 18px; } .k { font: 500 11px var(--mono); color: var(--ink2); letter-spacing: 1.5px; }
.x { position: absolute; right: 10px; top: 8px; background: none; border: 0; color: var(--ink2); font-size: 22px; cursor: pointer; min-width: 36px; min-height: 36px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cell { background: #0A1A40; border-radius: 8px; padding: 8px 10px; } .cell .v { font: 600 16px var(--mono); color: var(--ink); } .cell .l { font-size: 11px; color: var(--ink2); }
.thumb { aspect-ratio: 1; border-radius: 8px; border: 1px dashed var(--edge); display: grid; place-items: center; text-align: center; font-size: 11px; color: var(--ink2); padding: 6px;
  background: repeating-linear-gradient(45deg, #0A1A40, #0A1A40 6px, #0C1F4A 6px, #0C1F4A 12px); }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--cyan); color: var(--cyan); background: transparent; font: 600 14px var(--display); text-decoration: none; cursor: pointer; }
.btn.solid { background: var(--neon); color: #02122E; border-color: var(--neon); }
.note { font-size: 12px; color: var(--ink2); margin: 0; line-height: 1.45; }
.list { display: flex; flex-direction: column; gap: 6px; }
.list button { text-align: left; background: #0A1A40; border: 1px solid transparent; color: var(--ink); border-radius: 8px; padding: 8px 10px; font: 13px var(--mono); cursor: pointer; }
.list button:hover { border-color: var(--cyan); }
.legend { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: 16px; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--ink2); display: flex; flex-direction: column; gap: 6px; max-width: 250px; }
.ramp { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #3A6FD0, #5FB4F0, #9FF0FF); }
.demo { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: 16px; font: 11px var(--mono); color: #FFD27A; background: #2A1E05cc; border: 1px solid #6B5212; border-radius: 8px; padding: 6px 10px; max-width: 300px; }
@media (max-width: 760px) {
  nav { padding: 8px 10px; gap: 8px; } .brand { font-size: 14px; } .brand small { display: none; }
  .ctrl { width: 100%; gap: 6px; flex-wrap: nowrap; } .ctrl .seg button { padding: 0 9px; font-size: 12px; min-height: 34px; }
  #busca { flex: 1; min-width: 0; } #q { width: 100% !important; min-width: 0; font-size: 16px !important; } #busca .btn { padding: 0 10px; }
  .ctrl > .seg:first-child { display: none; }
  .hero { top: 92px; } .hero h1 { font-size: 22px; } .hero p { font-size: 13px; }
  .stats, .badge, .legend { display: none; } .demo { left: 10px; right: 10px; bottom: 10px; max-width: none; font-size: 10px; }
  #panel, #panel.wide { left: 0; right: 0; bottom: 0; top: auto; width: 100%; max-height: 64vh; border-radius: 16px 16px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
  #panel::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--edge); margin: -4px auto 4px; }
  body.paneled .demo { display: none; }
  .slide .media img, .slide .media canvas { max-height: 38vh; }
  .gl { font-size: 11px; } .nexts { grid-template-columns: 1fr !important; }
}
</style>
</head>
<body>
<canvas id="cv" aria-label="Globe with NISAR frames"></canvas>
<nav>
  <div class="brand">Delta L · NISAR Anomaly Watch<small data-i="tag"></small></div>
  <div class="ctrl">
    <div class="seg" role="group" aria-label="Pass direction"><button data-dir="all" aria-pressed="true" data-i="dAll"></button><button data-dir="A" aria-pressed="false" data-i="dAsc"></button><button data-dir="D" aria-pressed="false" data-i="dDesc"></button></div>
    <form id="busca" role="search" style="display:flex;gap:6px"><input id="q" list="lugares" aria-label="Search" style="min-height:36px;border-radius:999px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);padding:0 14px;font:14px var(--display);width:min(240px,50vw)"><datalist id="lugares"></datalist><button class="btn" style="min-height:36px" data-i="go"></button></form>
    <div class="seg" role="group" aria-label="Language"><button id="l-en" aria-pressed="true">EN</button><button id="l-pt" aria-pressed="false">PT</button></div>
  </div>
</nav>
<div class="hero"><h1 data-i="h1"></h1><p data-i="hint"></p></div>

<div class="stats"><div><b id="sF">–</b><span data-i="stFrames"></span></div><div><b data-i="st12"></b><span data-i="st12b"></span></div><div><b data-i="stL"></b><span data-i="stLb"></span></div></div>
<div class="legend"><b style="color:var(--ink)" data-i="lgT"></b><div class="ramp"></div><div style="display:flex;justify-content:space-between"><span data-i="lgFew"></span><span data-i="lgMany"></span></div><span><span style="color:var(--neon)">■</span> <span data-i="lgFull"></span></span><span><span style="color:var(--cyan)">■</span> <span data-i="lgHL"></span></span></div>
<div class="demo" id="demo"></div>

<aside id="panel" aria-live="polite"><button class="x" id="close" aria-label="Close">×</button><div id="pbody"></div></aside>

<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<script src="dados.js"></script>
<script>
