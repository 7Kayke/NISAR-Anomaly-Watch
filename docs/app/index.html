<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NISAR Waltz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;700&family=Overpass:wght@600;800&display=swap">
<style>
/* Layout: one study area. Change map + timeline + clicked-pixel panel first, then findings, accuracy, the point's story, polarizations, data, context. */
:root {
  --bg: #07173F; --panel: #0B2257; --deep: #061235; --line: #1F3C7A; --line-strong: #3A5A94;
  --fg: #E8EEF7; --muted: #A9BAD4; --soft: #CBD7EA;
  --accent: #EAFE07; --asc: #2E96F5; --desc: #C77DFF; --sm: #3BD18A; --rain: #6FA8DC; --bad: #FF8A8A;
  --display: "Overpass", "Fira Sans", system-ui, sans-serif; --body: "Fira Sans", system-ui, sans-serif; --mono: "Fira Code", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--asc); } a:hover { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 72px; display: flex; flex-direction: column; gap: 52px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .bar { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 10px; } .brand b { font-family: var(--display); font-weight: 800; font-size: 20px; } .brand span { font-family: var(--mono); font-size: 12px; color: var(--muted); }
nav.steps { display: flex; flex-wrap: wrap; gap: 2px; } nav.steps a { text-decoration: none; color: var(--fg); font-size: 14px; padding: 10px 10px; border-radius: 8px; min-height: 44px; display: inline-flex; align-items: center; } nav.steps a:hover { background: var(--panel); color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
.seg button { background: transparent; color: var(--fg); border: 0; font: 500 14px var(--body); padding: 0 14px; min-height: 40px; cursor: pointer; } .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.hero { padding-top: 32px; display: flex; flex-direction: column; gap: 10px; max-width: 880px; }
.eyebrow { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(32px, 5vw, 52px); line-height: 1.05; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3vw, 32px); margin: 0; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; }
.lead { font-size: 18px; color: var(--soft); margin: 0; max-width: 72ch; }
.muted { color: var(--muted); } .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
section { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 76px; }
.row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg); border-radius: 999px; padding: 0 14px; min-height: 40px; font: 500 14px var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.tog[aria-pressed="true"] { background: var(--panel); color: var(--fg); }
.chip.tog[aria-pressed="false"] { opacity: 0.55; }
.swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: #07173F; font: 700 15px var(--body); cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line-strong); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
.field select, .field input[type="date"] { background: var(--deep); color: var(--fg); border: 1px solid var(--line-strong); border-radius: 8px; min-height: 44px; padding: 0 10px; font: 15px var(--body); }
/* map */
.mapcol { flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.mapstage { position: relative; background: var(--deep); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.mapstage canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; cursor: crosshair; }
.mapstage canvas.top { position: absolute; inset: 0; pointer-events: none; }
.swipe { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--accent); pointer-events: none; }
.swipe span { position: absolute; top: 8px; transform: translateX(-50%); background: var(--accent); color: #07173F; font: 700 12px var(--mono); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.marker { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 2px solid var(--accent); border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 2px #07173F; }
.maplabel { position: absolute; left: 10px; bottom: 10px; background: rgba(6,18,53,0.9); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; font: 13px var(--mono); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--soft); }
.ramp { height: 10px; width: 160px; border-radius: 5px; }
input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 32px; }
.timeline { display: flex; flex-direction: column; gap: 6px; }
.tlbar { position: relative; height: 26px; border-radius: 6px; background: var(--deep); border: 1px solid var(--line); overflow: hidden; }
.tlbar .band { position: absolute; top: 0; bottom: 0; }
.tlbar .tick { position: absolute; top: 4px; bottom: 4px; width: 2px; background: var(--asc); }
.tlbar .tick.sel { background: var(--accent); width: 4px; top: 0; bottom: 0; }
.tlrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
.side { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; } .kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.card .val { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.1; }
.tag { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.t-visivel .tag, .t-visivel .val { color: var(--asc); } .t-invisivel .tag, .t-invisivel .val { color: var(--sm); } .t-chao .tag, .t-chao .val { color: var(--desc); }
.t-lento .tag, .t-lento .val { color: var(--accent); } .t-qualidade .tag, .t-qualidade .val { color: var(--bad); }
.barlist { display: flex; flex-direction: column; gap: 6px; }
.barrow { display: grid; grid-template-columns: minmax(120px, 190px) 1fr 76px; gap: 10px; align-items: center; font-size: 14px; }
.barrow .b { height: 12px; border-radius: 6px; } .barrow .n { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; } table { border-collapse: collapse; font: 13px var(--mono); font-variant-numeric: tabular-nums; } th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 16px; }
.chartbox { position: relative; } .chartbox svg { display: block; width: 100%; height: auto; }
.tip { position: absolute; pointer-events: none; background: #020A22; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; font: 13px/1.45 var(--mono); white-space: nowrap; z-index: 2; }
details summary { cursor: pointer; color: var(--asc); font-size: 14px; min-height: 32px; }
ul.plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--soft); }
.gloss { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; } .gloss dt { font-family: var(--display); font-weight: 600; font-size: 17px; } .gloss dd { margin: 4px 0 0; color: var(--soft); font-size: 15px; }
.empty { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 18px; color: var(--muted); }
footer { color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 18px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
@media (max-width: 700px) { nav.steps { display: none; } .barrow { grid-template-columns: 110px 1fr 64px; } }
</style>

<header class="top">
  <div class="bar">
    <div class="brand"><b>Delta L</b><span data-i18n="brandSub"></span></div>
    <nav class="steps" aria-label="Sections">
      <a href="#map" data-i18n="navMap"></a><a href="#what" data-i18n="navWhat"></a><a href="#trust" data-i18n="navTrust"></a>
      <a href="#point" data-i18n="navPoint"></a><a href="#pol" data-i18n="navPol"></a><a href="#data" data-i18n="navData"></a>
    </nav>
    <div class="seg" role="group" aria-label="Language"><button type="button" id="lang-en" aria-pressed="true">EN</button><button type="button" id="lang-pt" aria-pressed="false">PT</button></div>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 id="area-title"></h1>
    <p class="lead" id="area-lead"></p>
  </div>

  <section id="map" aria-labelledby="map-h">
    <h2 id="map-h" data-i18n="mapTitle"></h2>
    <div class="panel" style="display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end">
      <div class="field"><label for="geo" data-i18n="geoLabel"></label><select id="geo"></select></div>
      <div class="field" style="min-width:min(100%,420px);flex:1 1 420px"><span id="layers-label" data-i18n="layerLabel"></span><div class="chips" role="group" aria-labelledby="layers-label" id="layers"></div></div>
      <div class="field"><span data-i18n="modeLabel"></span><div class="seg" role="group" aria-label="View mode"><button type="button" id="mode-one" aria-pressed="true" data-i18n="modeOne"></button><button type="button" id="mode-swipe" aria-pressed="false" data-i18n="modeSwipe"></button></div></div>
    </div>
    <div class="row">
      <div class="mapcol">
        <div class="chips" id="classfilter" role="group" aria-label="Change classes"></div>
        <div class="mapstage" id="stage">
          <canvas id="cv" role="img" aria-label="Change map of the study area"></canvas>
          <canvas id="cv2" class="top" aria-hidden="true"></canvas>
          <div class="swipe" id="swipe" hidden><span id="swipe-l"></span></div>
          <div class="marker" id="marker" hidden></div>
          <div class="maplabel" id="maplabel"></div>
        </div>
        <div id="swipe-ctl" hidden><label class="field" for="swipe-r"><span data-i18n="swipeHelp"></span></label><input type="range" id="swipe-r" min="0" max="100" value="50"></div>
        <div class="legend" id="legend"></div>
        <div class="timeline panel">
          <div class="tlrow">
            <div class="chips">
              <button type="button" class="btn" id="play" aria-pressed="false" data-i18n="play"></button>
              <div class="field"><label for="anim-n" data-i18n="animDates"></label><select id="anim-n"><option value="all"></option><option value="14" selected></option></select></div>
            </div>
            <span id="date-now" class="mono" style="font-size:18px;color:var(--fg)"></span>
          </div>
          <label for="tslider" class="muted" style="font-size:13px" data-i18n="dateHelp"></label>
          <input type="range" id="tslider" min="0" max="0" value="0">
          <div class="tlbar" id="tlbar" aria-hidden="true"></div>
          <div class="tlrow" id="tlhint"></div>
          <div class="chips" id="swipe-dates" hidden>
            <div class="field"><label for="before" data-i18n="before"></label><select id="before"></select></div>
            <div class="field"><label for="after" data-i18n="after"></label><select id="after"></select></div>
          </div>
        </div>
      </div>
      <aside class="side" aria-live="polite">
        <div class="panel" id="pixel"></div>
        <div class="panel" id="pixchart"></div>
      </aside>
    </div>
  </section>

  <section id="what" aria-labelledby="what-h">
    <div class="eyebrow" data-i18n="whatEye"></div>
    <h2 id="what-h" data-i18n="whatTitle"></h2>
    <div class="row">
      <div class="panel" style="flex:1 1 420px"><h3 data-i18n="areaByClass"></h3><div class="barlist" id="classbars" style="margin-top:10px"></div></div>
      <div class="panel" style="flex:1 1 420px"><h3 data-i18n="dropsWhen"></h3><p class="muted" style="margin:4px 0 10px;font-size:14px" data-i18n="dropsSub"></p><div class="barlist" id="dropbars"></div></div>
    </div>
    <div class="panel"><h3 data-i18n="whyTitle"></h3><p class="muted" style="margin:4px 0 10px;font-size:14px" data-i18n="whySub"></p><ul class="plain" id="why"></ul></div>
    <div class="cards" id="invisible"></div>
  </section>

  <section id="trust" aria-labelledby="trust-h">
    <div class="eyebrow" data-i18n="trustEye"></div>
    <h2 id="trust-h" data-i18n="trustTitle"></h2>
    <p class="lead" style="font-size:16px" data-i18n="trustLead"></p>
    <div class="panel tablewrap" id="agree"></div>
    <div class="panel"><h3 data-i18n="limTitle"></h3><ul class="plain" id="lims"></ul></div>
  </section>

  <section id="point" aria-labelledby="point-h">
    <div class="eyebrow" data-i18n="pointEye"></div>
    <h2 id="point-h"><span data-i18n="pointTitle"></span> <span id="pt-name" class="muted"></span></h2>
    <div class="cards" id="ptcards"></div>
    <div class="charts" id="ptcharts"></div>
  </section>

  <section id="pol" aria-labelledby="pol-h">
    <div class="eyebrow" data-i18n="polEye"></div>
    <h2 id="pol-h" data-i18n="polTitle"></h2>
    <dl class="gloss" id="gloss"></dl>
    <div class="panel"><h3 data-i18n="futureTitle"></h3><ul class="plain" id="future"></ul></div>
  </section>

  <section id="data" aria-labelledby="data-h">
    <div class="eyebrow" data-i18n="dataEye"></div>
    <h2 id="data-h" data-i18n="dataTitle"></h2>
    <p class="lead" style="font-size:16px" data-i18n="dataLead"></p>
    <div class="chips">
      <button type="button" class="btn" id="copy-pix" data-i18n="copyPix"></button>
      <a class="btn ghost" id="dl-point" href="#" target="_blank" rel="noopener" data-i18n="dlPoint"></a>
      <a class="btn ghost" id="dl-mesh" href="#" target="_blank" rel="noopener" data-i18n="dlMesh"></a>
      <span id="copy-msg" class="muted" role="status"></span>
    </div>
    <div class="panel tablewrap"><table id="files"></table></div>
  </section>

  <footer>
    <div data-i18n="foot1"></div>
    <div data-i18n="foot2"></div>
  </footer>
</main>

  const s = pixSeries(S.pix); const g = lineChart(s.map((x) => ({ t: Date.parse(x.d), a: x.hv, b: x.hh })), S.t);
  ch.innerHTML = `<h3>${esc(t("pixChart"))}</h3><div class="chartbox">${g}</div><div class="legend"><span><span class="swatch" style="background:var(--asc)"></span> HV</span><span><span class="swatch" style="background:var(--sm)"></span> HH</span><span class="muted">dB</span></div>`;
}
function lineChart(rows, sel) {
  const Wc = 520, Hc = 220, L = 40, Rr = 10, Tp = 10, B = 28; const ts = rows.map((r) => r.t); const x0 = Math.min(...ts) - 3 * 864e5, x1 = Math.max(...ts) + 3 * 864e5;
  const vals = rows.flatMap((r) => [r.a, r.b]).filter((v) => v != null); if (!vals.length) return `<p class="muted">–</p>`;
  let y0 = Math.floor(Math.min(...vals)) - 1, y1 = Math.ceil(Math.max(...vals)) + 1;
  const X = (v) => L + (v - x0) / (x1 - x0) * (Wc - L - Rr), Y = (v) => Tp + (1 - (v - y0) / (y1 - y0)) * (Hc - Tp - B);
  let s = `<svg viewBox="0 0 ${Wc} ${Hc}" role="img" aria-label="HV and HH at the clicked place over time"><rect width="${Wc}" height="${Hc}" fill="#0B2257"></rect>`;
  const step = (y1 - y0) > 10 ? 4 : 2; for (let v = Math.ceil(y0 / step) * step; v <= y1; v += step) s += `<line x1="${L}" x2="${Wc - Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1F3C7A"></line><text x="${L - 5}" y="${Y(v) + 4}" fill="#A9BAD4" font-size="11" text-anchor="end" font-family="Fira Code, monospace">${v}</text>`;
  const MN = lang === "pt" ? ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"] : ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  let m = new Date(x0); m = new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + 1, 1)); while (m.getTime() < x1) { s += `<text x="${X(m.getTime())}" y="${Hc - 8}" fill="#A9BAD4" font-size="11" text-anchor="middle" font-family="Fira Code, monospace">${MN[m.getUTCMonth()]}</text>`; m = new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + 1, 1)); }
  const line = (key, col) => { let d = ""; let prev = null; rows.forEach((r) => { if (r[key] == null) { prev = null; return; } d += `${prev ? "L" : "M"}${X(r.t).toFixed(1)} ${Y(r[key]).toFixed(1)} `; prev = r; });
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2"></path>` + rows.filter((r) => r[key] != null).map((r) => `<circle cx="${X(r.t).toFixed(1)}" cy="${Y(r[key]).toFixed(1)}" r="3" fill="${col}"></circle>`).join(""); };
  s += line("b", "#3BD18A") + line("a", "#2E96F5");
  if (rows[sel]) s += `<line x1="${X(rows[sel].t)}" x2="${X(rows[sel].t)}" y1="${Tp}" y2="${Hc - B}" stroke="#EAFE07" stroke-dasharray="3 3"></line>`;
  return s + "</svg>";
}
$("cv").addEventListener("click", (e) => { if (!S.meta) return; const r = e.currentTarget.getBoundingClientRect(); const [, H, W] = S.meta.forma;
  S.pix = [Math.min(W - 1, Math.floor((e.clientX - r.left) / r.width * W)), Math.min(H - 1, Math.floor((e.clientY - r.top) / r.height * H))]; placeMarker(); renderPixel(); });
// ---------- timeline / play / swipe ----------
$("tslider").addEventListener("input", (e) => { S.t = +e.target.value; renderMap(); renderPixel(); });
$("swipe-r").addEventListener("input", () => renderMap());
$("before").addEventListener("change", (e) => { S.before = +e.target.value; renderMap(); });
$("after").addEventListener("change", (e) => { S.after = +e.target.value; renderMap(); });
$("mode-one").addEventListener("click", () => { S.mode = "one"; $("mode-one").setAttribute("aria-pressed", "true"); $("mode-swipe").setAttribute("aria-pressed", "false"); renderMap(); });
$("mode-swipe").addEventListener("click", () => { S.mode = "swipe"; if (S.layer !== "hv" && S.layer !== "hh") { S.layer = "hv"; renderLayers(); renderClassFilter(); } $("mode-swipe").setAttribute("aria-pressed", "true"); $("mode-one").setAttribute("aria-pressed", "false"); renderMap(); });
function animFrames() { const n = S.meta.datas.length; if ($("anim-n").value === "all" || n <= 14) return [...Array(n).keys()]; const out = new Set([0, n - 1]); for (let i = 1; i <= 12; i++) out.add(Math.round(i * (n - 1) / 13)); return [...out].sort((a, b) => a - b); }
$("play").addEventListener("click", () => {
  if (S.playing) { clearInterval(S.playing); S.playing = null; $("play").textContent = t("play"); $("play").setAttribute("aria-pressed", "false"); return; }
  if (S.layer !== "hv" && S.layer !== "hh") { S.layer = "hv"; renderLayers(); renderClassFilter(); }
  const fr = animFrames(); let j = 0; $("play").textContent = t("pause"); $("play").setAttribute("aria-pressed", "true");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  S.playing = setInterval(() => { S.t = fr[j]; $("tslider").value = S.t; renderMap(); renderPixel(); j = (j + 1) % fr.length; }, reduce ? 1600 : 800);
});
$("geo").addEventListener("change", (e) => { S.pix = S.pix; loadGeo(e.target.value); });

// ---------- what changed / why / trust ----------
function sumRain(a, b) { const c = S.area.clima?.chuva_mm; if (!c) return null; let s = 0; Object.entries(c).forEach(([d, v]) => { if (d > a && d <= b) s += v; }); return s; }
function renderWhat() {
  if (!S.geo) { ["classbars", "dropbars", "why", "invisible"].forEach((id) => { $(id).innerHTML = ""; }); return; }
  const ha = S.geo.classes_ha || {}; const total = Object.values(ha).reduce((a, b) => a + b, 0) || 1; const names = Object.fromEntries(Object.entries(S.meta.classes).map(([c, v]) => [v.nome, c]));
  $("classbars").innerHTML = Object.entries(ha).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).map(([n, v]) => { const c = names[n];
    return `<div class="barrow"><span><span class="swatch" style="background:${S.meta.classes[c]?.cor}"></span> ${esc(T[lang].cls[c] || n)}</span><span class="b" style="width:${Math.max(2, 100 * v / total)}%;background:${S.meta.classes[c]?.cor}"></span><span class="n">${fmt(v, 0)} ha</span></div>`; }).join("");
  const drops = Object.entries(S.geo.quedas_por_intervalo_ha || {}); const mx = Math.max(1, ...drops.map((d) => d[1]));
  $("dropbars").innerHTML = drops.length ? drops.map(([k, v]) => { const [a, b] = k.split("→"); return `<div class="barrow"><span class="mono">${fdate(a)} → ${fdate(b)}</span><span class="b" style="width:${Math.max(2, 100 * v / mx)}%;background:#FF6B00"></span><span class="n">${fmt(v, 0)} ha</span></div>`; }).join("") : `<p class="muted">–</p>`;
  const why = [];
  drops.sort((a, b) => b[1] - a[1]).slice(0, 3).forEach(([k, v]) => { const [a, b] = k.split("→"); const mm = sumRain(a, b);
    if (mm == null) return; const days = Math.max(1, (Date.parse(b) - Date.parse(a)) / 864e5);
    why.push(fill(t(mm / days < 1.5 ? "whyDry" : "whyWet"), { a: fdate(a), b: fdate(b), ha: fmt(v, 0), mm: fmt(mm, 0) })); });
  if (ha[S.meta.classes[4]?.nome] > 0) why.push(fill(t("whyRise"), { ha: fmt(ha[S.meta.classes[4].nome], 0) }));
  if (ha[S.meta.classes[5]?.nome] > 0) why.push(fill(t("whyWater"), { ha: fmt(ha[S.meta.classes[5].nome], 0) }));
  if (ha[S.meta.classes[2]?.nome] > 0) why.push(fill(t("whyRhythm"), { ha: fmt(ha[S.meta.classes[2].nome], 0) }));
  $("why").innerHTML = why.map((w) => `<li>${esc(w)}</li>`).join("") || `<li>–</li>`;
  const vi = S.geo.valsa_invisivel || {};
  const cards = [];
  if (vi.correlacao_area_HH_vs_chuva_antecedente != null) cards.push(["invisivel", `r ${fmt(vi.correlacao_area_HH_vs_chuva_antecedente, 2)}`, lang === "pt" ? "O brilho HH da área inteira acompanha a chuva dos 7 dias anteriores: a água no solo, invisível ao olho." : "The whole area's HH brightness follows the previous 7 days of rain: water in the soil, invisible to the eye."]);
  if (vi.pixels_que_respondem_a_chuva_pct != null) cards.push(["invisivel", `${fmt(vi.pixels_que_respondem_a_chuva_pct, 0)}%`, lang === "pt" ? "dos pixels respondem forte à chuva (r > 0,6): onde a água entra e sai do solo." : "of the pixels respond strongly to rain (r > 0.6): where water goes in and out of the soil."]);
  if (vi.tendencia_mediana_db_mes != null) cards.push(["lento", `${fmt(vi.tendencia_mediana_db_mes, 2)} ${t("dbmo")}`, lang === "pt" ? "Tendência mediana do HV na área: a valsa lenta, que nenhuma imagem isolada mostra." : "Median HV trend in the area: the slow waltz no single image shows."]);
  const areaCards = (S.area?.achados || []).map((a) => [a.tipo, typeof a.valor === "object" ? (a.valor[lang] || a.valor.en) : a.valor, a[lang] || a.en]);
  const tagOf = (k) => ({ invisivel: lang === "pt" ? "valsa invisível" : "invisible waltz", lento: lang === "pt" ? "mudança lenta" : "slow change", chao: lang === "pt" ? "chão" : "ground", visivel: lang === "pt" ? "valsa visível" : "visible waltz" }[k] || k);
  $("invisible").innerHTML = areaCards.concat(cards).map(([k, v, txt]) => `<article class="card t-${k}"><span class="tag">${esc(tagOf(k))}</span><span class="val">${esc(v)}</span><p style="margin:0;color:var(--soft)">${esc(txt)}</p></article>`).join("");
  if (false) $("invisible").innerHTML = cards.map(([k, v, txt]) => `<article class="card t-${k}"><span class="tag">${esc(k === "invisivel" ? (lang === "pt" ? "valsa invisível" : "invisible waltz") : (lang === "pt" ? "mudança lenta" : "slow change"))}</span><span class="val">${esc(v)}</span><p style="margin:0;color:var(--soft)">${esc(txt)}</p></article>`).join("");
}
function renderTrust() {
  const ag = S.area?.assertividade;
  if (!ag) { $("agree").innerHTML = `<p class="muted">${esc(t("noAgree"))}</p>`; }
  else { let h = `<table><thead><tr><th>${esc(t("clsLbl"))}</th><th>${esc(t("seenBy"))}</th><th>${esc(t("pixels"))}</th><th>${esc(t("confirmedBy"))}</th><th>% ${esc(t("confirmed"))}</th></tr></thead><tbody>`;
    Object.entries(ag).forEach(([nm, rows]) => rows.forEach((r) => { h += `<tr><td style="font-family:var(--body)">${esc(T[lang].cls[nm === "queda_abrupta" ? 3 : 4])}</td><td>${esc(geoName(r.vista_por))}</td><td>${r.pixels}</td><td>${esc(geoName(r.confirmada_por))}</td><td><strong style="color:var(--accent)">${fmt(r.confirmados_pct, 1)}%</strong></td></tr>`; }));
    $("agree").innerHTML = h + "</tbody></table>"; }
  const lims = [];
  if (S.area?.geometrias?.length) { const g = S.area.geometrias; lims.push(lang === "pt" ? `${g.length} direções de passagem; a principal tem ${g[0].passagens} datas (${fdate(g[0].primeira)} a ${fdate(g[0].ultima)}).` : `${g.length} pass directions; the main one has ${g[0].passagens} dates (${fdate(g[0].primeira)} to ${fdate(g[0].ultima)}).`); }
  (S.area?.limitacoes || []).forEach((l) => lims.push(l[lang] || l.en));
  (S.point?.limitacoes || []).forEach((l) => lims.push(l[lang] || l.en));
  lims.push(lang === "pt" ? "As causas são hipóteses: o radar mostra o que mudou e quando; o porquê precisa de confirmação em campo." : "Causes are hypotheses: radar shows what changed and when; the why needs field confirmation.");
  $("lims").innerHTML = lims.map((l) => `<li>${esc(l)}</li>`).join("");
}
// ---------- point story ----------
function renderPoint() {
  const P = S.point; if (!P) { $("pt-name").textContent = ""; $("ptcards").innerHTML = `<div class="empty">${esc(t("noArea"))}</div>`; $("ptcharts").innerHTML = ""; return; }
  $("pt-name").textContent = `${P.nome} (${fmt(P.lat, 3)}, ${fmt(P.lon, 3)})`;
  const tagN = { visivel: ["visible waltz", "valsa visível"], invisivel: ["invisible waltz", "valsa invisível"], chao: ["ground", "chão"], lento: ["slow change", "mudança lenta"], qualidade: ["quality check", "qualidade"] };
  $("ptcards").innerHTML = P.achados.map((a) => `<article class="card t-${esc(a.tipo)}"><span class="tag">${esc((tagN[a.tipo] || [a.tipo, a.tipo])[lang === "pt" ? 1 : 0])}</span><span class="val">${esc(typeof a.valor === "object" ? a.valor[lang] || a.valor.en : a.valor)}</span><p style="margin:0;color:var(--soft)">${esc(a[lang] || a.en)}</p></article>`).join("");
  const byG = {}; P.serie.filter((s) => !s.anom).forEach((s) => { (byG[s.g] = byG[s.g] || []).push(s); });
  const seenTk = new Set();
  const order = Object.keys(byG).sort((a, b) => byG[b].filter((x) => x.hv != null).length - byG[a].filter((x) => x.hv != null).length)
    .filter((g) => { const tk = g.split("_").slice(0, 2).join("_"); if (seenTk.has(tk)) return false; seenTk.add(tk); return true; }).slice(0, 4);
  $("ptcharts").innerHTML = order.map((g) => `<figure class="panel" style="margin:0"><figcaption><h3>${esc(geoName(g))}</h3><span class="muted">HV · HH (dB) · ${byG[g].length} ${lang === "pt" ? "passagens" : "passes"}</span></figcaption><div class="chartbox">${lineChart(byG[g].map((s) => ({ t: Date.parse(s.d), a: s.hv, b: s.hh })), -1)}</div><div class="legend"><span><span class="swatch" style="background:var(--asc)"></span> HV</span><span><span class="swatch" style="background:var(--sm)"></span> HH</span></div></figure>`).join("");
  $("dl-point").href = "data/" + (S.region.pontos?.[0]?.arquivo || "");
}
// ---------- copy ----------
$("copy-pix").addEventListener("click", async () => { if (!S.pix || !S.meta) return; const [lon, lat] = pixToLonLat(...S.pix);
  const rows = [["date", "pass", "lat", "lon", "hv_db", "hh_db"]].concat(pixSeries(S.pix).map((r) => [r.d, S.geo.id, lat.toFixed(5), lon.toFixed(5), r.hv?.toFixed(2) ?? "", r.hh?.toFixed(2) ?? ""]));
  try { await navigator.clipboard.writeText(rows.map((r) => r.join(",")).join("\n")); $("copy-msg").textContent = t("copied"); } catch (e) { $("copy-msg").textContent = t("copyFail"); } });

// ---------- i18n + boot ----------
function renderStatic() {
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  $("lang-en").setAttribute("aria-pressed", String(lang === "en")); $("lang-pt").setAttribute("aria-pressed", String(lang === "pt"));
  $("anim-n").options[0].textContent = t("animAll"); $("anim-n").options[1].textContent = t("anim14");
  if (S.playing) $("play").textContent = t("pause");
  $("gloss").innerHTML = T[lang].gloss.map(([a, b]) => `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("");
  $("future").innerHTML = T[lang].future.map((x) => `<li>${esc(x)}</li>`).join("");
  $("files").innerHTML = `<thead><tr>${T[lang].filesH.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${T[lang].files.map((r) => `<tr>${r.map((c, i) => `<td${i ? ' style="font-family:var(--body)"' : ""}>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>`;
  if (S.region) { $("area-title").textContent = S.region.nome; $("area-lead").textContent = (lang === "pt" ? S.region.contexto_pt : S.region.contexto_en) || ""; }
  if (S.area) $("geo").innerHTML = S.area.geometrias.map((g) => `<option value="${esc(g.id)}"${g.id === S.geo?.id ? " selected" : ""}>${esc(geoName(g.id))} · ${g.passagens} ${lang === "pt" ? "datas" : "dates"}</option>`).join("");
}
function renderAll() { renderStatic(); renderLayers(); renderClassFilter(); renderMap(); renderPixel(); renderWhat(); renderTrust(); renderPoint(); }
["en", "pt"].forEach((l) => $("lang-" + l).addEventListener("click", () => { lang = l; try { localStorage.setItem("dl-lang", l); } catch (e) {} renderAll(); }));
(async () => {
  renderStatic();
  let regs = []; try { regs = await getJSON("data/regioes.json"); } catch (e) {}
  S.region = regs.find((r) => r.area) || regs[0] || null;
  if (!S.region) { renderAll(); return; }
  S.area = S.region.area;
  if (S.region.malha) $("dl-mesh").href = "data/" + S.region.malha; else $("dl-mesh").hidden = true;
  if (S.region.pontos?.length) { try { S.point = await getJSON("data/" + S.region.pontos[0].arquivo); } catch (e) {} } else $("dl-point").hidden = true;
  if (S.area?.coerencia) { try { S.coh = await getBin("data/" + S.area.coerencia); } catch (e) {} }
  if (S.area?.geometrias?.length) await loadGeo(S.area.geometrias[0].id); else renderAll();
})();
})();
</script>
