<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NISAR Anomaly Watch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;700;800&family=Overpass:wght@400;600;700&display=swap">
<style>
/* Layout: the original Delta L explorer. Left: area, period, scenes, availability. Right: area + demarcated areas, timeline, where it changed, validation, result, technical sheet, gallery. */
:root {
  --ground: #EEF2F8; --card: #FFFFFF; --ink: #0B1530; --ink2: #44506A; --ink3: #5A6680; --line: #D5DBE6; --line2: #B8C3D6; --soft: #F4F6FA;
  --deep: #07173F; --blue: #0042A6; --yonder: #2E96F5; --neon: #EAFE07; --sky: #9CC9FA;
  --display: "Fira Sans", system-ui, sans-serif; --body: "Overpass", "Fira Sans", system-ui, sans-serif; --mono: "Fira Code", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--ground); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; }
a { color: var(--blue); } a:hover { color: var(--deep); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
header.top { background: var(--deep); color: #fff; }
header.top .in { max-width: 1400px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-block: 18px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.kick { font-family: var(--mono); font-size: 13px; letter-spacing: 3px; color: var(--sky); }
header h1 { margin: 2px 0 0; font-family: var(--display); font-weight: 800; font-size: clamp(20px, 2.6vw, 28px); text-wrap: balance; }
.pill { padding: 6px 12px; border-radius: 999px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid #3A5A94; border-radius: 999px; overflow: hidden; }
.seg button { background: transparent; color: #fff; border: 0; font: 600 14px var(--body); padding: 0 14px; min-height: 36px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--deep); }
main { max-width: 1400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
aside.side { flex: 1 1 300px; max-width: 380px; display: flex; flex-direction: column; gap: 16px; }
.col { flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--card); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 18px; font-family: var(--display); font-weight: 700; }
aside .card h2 { font-size: 16px; }
.lbl { font-size: 13px; color: var(--ink2); }
.inp { font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 8px; background: #fff; color: var(--ink); min-height: 44px; width: 100%; }
.btn { font: inherit; font-size: 14px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--blue); background: #fff; color: var(--blue); cursor: pointer; min-height: 44px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn.solid { background: var(--blue); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 8px; min-height: 40px; cursor: pointer; background: #fff; color: var(--ink); border: 1px solid var(--line2); }
.chip[aria-pressed="true"] { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 700; }
.chip:disabled { background: var(--soft); color: #8A94A8; border-style: dashed; cursor: not-allowed; }
.chip .tag { font-size: 11px; opacity: 0.8; }
.warn { background: #FFF8E1; border: 1px solid #E8C866; }
.warn ul { margin: 0; padding-left: 18px; font-size: 13px; color: #3A3320; }
.small { font-size: 12px; color: var(--ink3); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 20px; }
.areaimg { flex: 1 1 300px; min-width: 0; max-width: 484px; position: relative; }
.stage { position: relative; }
canvas.map { display: block; width: 100%; height: auto; border-radius: 8px; background: #000; image-rendering: pixelated; cursor: crosshair; }
.ptmark { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 3px solid var(--neon); border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 2px #000; }
.quad { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.quad b { font-size: 14px; } .quad span { font-size: 12px; color: var(--ink3); }
.tl { position: relative; height: 64px; background: var(--soft); border-radius: 8px; overflow: hidden; }
.tl .band { position: absolute; top: 0; bottom: 0; }
.tl .mk { position: absolute; top: 10px; bottom: 10px; border-radius: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink2); align-items: center; }
.sw { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: middle; }
.trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.trio figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.trio figcaption { font-size: 13px; }
.layer { font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 999px; min-height: 40px; cursor: pointer; border: 2px solid var(--line2); background: #fff; color: var(--ink2); }
.layer[aria-pressed="true"] { color: var(--deep); font-weight: 700; }
.pixinfo { font-family: var(--mono); font-size: 13px; background: var(--soft); border-radius: 8px; padding: 8px 12px; min-height: 36px; }
.val { background: var(--deep); color: #fff; }
.val p { margin: 0; font-size: 14px; color: #C9D6F0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: #0B2258; border-radius: 8px; padding: 12px; }
.tile .k { font-size: 12px; color: var(--sky); } .tile .v { font-size: 22px; font-weight: 700; font-family: var(--mono); }
.res ul { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.6; }
.next { background: var(--soft); border-radius: 8px; padding: 12px 14px; font-size: 14px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13px; }
th { text-align: left; background: var(--soft); padding: 8px; } td { padding: 8px; border-top: 1px solid #E3E8F0; }
td.f { font-family: var(--mono); font-size: 11px; word-break: break-all; }
.gal { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.gal figure { margin: 0; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: #fff; }
.gal img { width: 100%; height: auto; border-radius: 6px; background: var(--soft); cursor: zoom-in; }
.gal figcaption b { font-size: 14px; display: block; }
.gal figcaption span { font-size: 13px; color: var(--ink2); }
.src { align-self: flex-start; font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--ink2); }
.src.cmp { background: #FFF1E6; color: #8A3B00; }
dialog { border: 0; border-radius: 12px; padding: 12px; max-width: min(96vw, 1200px); }
dialog img { max-width: 100%; height: auto; display: block; }
dialog::backdrop { background: rgba(7, 23, 63, 0.75); }
.car-ctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.car-ctl input[type=range] { flex: 1 1 220px; accent-color: var(--blue); min-height: 32px; }
.car-date { font: 700 18px var(--mono); color: var(--deep); }
.swipe { position: relative; max-width: 640px; width: 100%; }
.swipe canvas, .swipe img { display: block; width: 100%; height: auto; border-radius: 8px; image-rendering: pixelated; }
.swipe img.top { position: absolute; inset: 0; height: 100%; object-fit: fill; }
.swipe .bar { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--neon); box-shadow: 0 0 0 1px #000; pointer-events: none; }
.swipe .lab { position: absolute; top: 8px; font: 600 12px var(--mono); background: rgba(7,23,63,.85); color: #fff; padding: 3px 8px; border-radius: 6px; pointer-events: none; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.thumbs button { font: inherit; text-align: left; border: 2px solid var(--line); border-radius: 10px; padding: 6px; background: #fff; cursor: pointer; display: flex; flex-direction: column; gap: 4px; color: var(--ink); }
.thumbs button[aria-pressed="true"] { border-color: var(--blue); }
.thumbs button:disabled { cursor: default; opacity: .55; }
.thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: var(--soft); }
.thumbs .ph { width: 100%; aspect-ratio: 1; border-radius: 6px; display: grid; place-items: center; text-align: center; font-size: 12px; color: var(--ink3); padding: 8px;
  background: repeating-linear-gradient(45deg, #F4F6FA, #F4F6FA 6px, #EBEFF5 6px, #EBEFF5 12px); }
.thumbs b { font-size: 13px; } .thumbs span { font-size: 12px; color: var(--ink3); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.metrics div { background: var(--soft); border-radius: 8px; padding: 8px 10px; } .metrics small { display: block; font-size: 11px; color: var(--ink3); } .metrics b { font: 600 16px var(--mono); }
footer { max-width: 1400px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; font-size: 13px; color: var(--ink3); }
</style>

<header class="top">
  <div class="in">
    <div>
      <div class="kick">DELTA L · NISAR ANOMALY WATCH</div>
      <h1 data-i="h1"></h1>
    </div>
    <div class="chips" style="align-items:center">
      <span class="pill" style="background:var(--blue)" data-i="pillData"></span>
      <span class="pill" style="background:var(--neon);color:var(--deep);font-weight:700" data-i="pillProto"></span>
      <div class="seg" role="group" aria-label="Language"><button type="button" id="l-pt" aria-pressed="true">PT</button><button type="button" id="l-en" aria-pressed="false">EN</button></div>
    </div>
  </div>
</header>

<main>
  <aside class="side">
    <section class="card">
      <h2 data-i="s1"></h2>
      <label for="area" class="lbl" data-i="s1lbl"></label>
      <input id="area" class="inp">
      <button type="button" class="btn" id="draw" data-i="draw"></button>
      <p class="small" id="drawmsg" role="status"></p>
    </section>
    <section class="card">
      <h2 data-i="s2"></h2>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <div><label for="ini" class="lbl" data-i="ini"></label><input id="ini" class="inp" readonly></div>
        <div><label for="fim" class="lbl" data-i="fim"></label><input id="fim" class="inp" readonly></div>
      </div>
      <p class="small" data-i="s2note"></p>
    </section>
    <section class="card">
      <h2 data-i="s3"></h2>
      <label for="geo" class="lbl" data-i="geoLbl"></label>
      <select id="geo" class="inp"></select>
      <div class="lbl" id="geoinfo"></div>
      <div style="font-size:13px;font-weight:700" data-i="before"></div>
      <div class="chips" id="bchips"></div>
      <div style="font-size:13px;font-weight:700" data-i="after"></div>
      <div class="chips" id="achips"></div>
      <p class="small" data-i="s3note"></p>
    </section>
    <section class="card warn">
      <h2 style="font-size:15px" data-i="warnT"></h2>
      <ul id="warns"></ul>
    </section>
  </aside>

  <div class="col">
    <section class="card">
      <div class="row">
        <div class="areaimg">
          <div class="stage"><canvas id="cvArea" class="map" aria-label="Radar image of the study area"></canvas><div class="ptmark" id="ptA" hidden></div></div>
          <p class="small" id="areacap" style="margin-top:6px"></p>
        </div>
        <div style="flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:10px">
          <h2 data-i="quadsT"></h2>
          <p style="margin:0;font-size:14px;color:var(--ink2)" data-i="quadsP"></p>
          <div id="quads" style="display:flex;flex-direction:column;gap:8px"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline">
        <h2 data-i="tlT"></h2><span class="lbl" id="tlrange" style="font-family:var(--mono)"></span>
      </div>
      <div class="tl" id="tl"></div>
      <div class="legend">
        <span><span class="sw" style="background:#F6C7C0"></span><span data-i="lgGap"></span></span>
        <span><span class="sw" style="background:#F3DE9A"></span><span data-i="lgPause"></span></span>
        <span><span class="sw" style="background:#0042A6"></span><span data-i="lgScene"></span></span>
      </div>
    </section>

    <section class="card">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center">
        <h2 data-i="whereT"></h2><span class="lbl" id="zoominfo"></span>
      </div>
      <div class="trio">
        <figure><div class="stage"><canvas id="cvB" class="map"></canvas><div class="ptmark" id="ptB" hidden></div></div><figcaption><b data-i="before"></b> · <span id="capB"></span></figcaption></figure>
        <figure><div class="stage"><canvas id="cvAf" class="map"></canvas><div class="ptmark" id="ptAf" hidden></div></div><figcaption><b data-i="after"></b> · <span id="capA"></span></figcaption></figure>
        <figure><div class="stage"><canvas id="cvC" class="map"></canvas><div class="ptmark" id="ptC" hidden></div></div><figcaption><b data-i="chgT"></b> · <span data-i="chgCap"></span></figcaption></figure>
      </div>
      <div class="pixinfo" id="pix" aria-live="polite"></div>
      <p class="small" data-i="whereNote"></p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="font-size:14px;font-weight:700" data-i="layersT"></div>
        <div class="chips" id="layers"></div>
      </div>
    </section>

    <section class="card" id="carrossel">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline">
        <h2 data-i="carT"></h2><span class="lbl" id="carGeo"></span>
      </div>
      <p style="margin:0;font-size:14px;color:var(--ink2)" data-i="carP"></p>
      <div class="car-ctl">
        <button type="button" class="btn" id="carPrev" aria-label="&lt;">◀</button>
        <button type="button" class="btn solid" id="carPlay" data-i="play"></button>
        <button type="button" class="btn" id="carNext" aria-label="&gt;">▶</button>
        <span class="car-date" id="carDate"></span>
        <input type="range" id="carRange" min="0" max="0" value="0" aria-label="Data">
      </div>
      <div class="row" style="align-items:flex-start">
        <div style="flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:6px">
          <div class="swipe" id="swipe"><canvas id="cvCar"></canvas><img class="top" id="carTop" alt=""><div class="bar" id="carBar"></div>
            <span class="lab" style="left:8px">NISAR HV</span><span class="lab" id="carLabR" style="right:8px"></span></div>
          <input type="range" id="carSwipe" min="0" max="100" value="50" aria-label="Comparar" style="accent-color:var(--neon)">
          <p class="small" data-i="carSwipeNote"></p>
        </div>
        <div style="flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:10px">
          <div class="thumbs" id="carThumbs"></div>
          <div class="metrics" id="carMetrics"></div>
        </div>
      </div>
    </section>

    <section class="card val">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center">
        <h2 data-i="valT"></h2>
        <span class="pill" style="background:var(--neon);color:var(--deep);font-weight:700;font-size:12px" data-i="valPill"></span>
      </div>
      <p data-i="valP"></p>
      <div class="tiles" id="tiles"></div>
    </section>

    <section class="card res" id="resultado" style="border-top:6px solid var(--line2)">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <span class="pill" id="status" style="font-weight:700"></span>
        <h2 id="headline" style="font-size:20px"></h2>
      </div>
      <ul id="bullets"></ul>
      <div class="next"><b data-i="nextT"></b> <span id="next"></span></div>
    </section>

    <section class="card">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center">
        <h2 data-i="fichaT"></h2>
        <div class="chips" style="align-items:center">
          <a class="btn solid" id="jsonlink" href="#" target="_blank" rel="noopener">JSON</a>
          <button type="button" class="btn" id="csvbtn">CSV</button>
          <span class="small" id="csvmsg" role="status"></span>
        </div>
      </div>
      <div class="tablewrap"><table><thead><tr id="fhead"></tr></thead><tbody id="fbody"></tbody></table></div>
      <p class="small" id="fnote"></p>
    </section>

    <section class="card" id="galeria">
      <h2 data-i="galT"></h2>
      <p style="margin:0;font-size:14px;color:var(--ink2)" data-i="galP"></p>
      <h3 style="margin:6px 0 0;font-size:15px" data-i="galN"></h3>
      <div class="gal" id="galN"></div>
      <h3 style="margin:10px 0 0;font-size:15px" data-i="galC"></h3>
      <div class="gal" id="galC"></div>
    </section>
  </div>
</main>
<footer><span data-i="foot"></span></footer>
<dialog id="dlg"><img id="dlgimg" alt=""><form method="dialog" style="text-align:right;margin-top:8px"><button class="btn" data-i="close"></button></form></dialog>

<script>
(() => {
const T = {
pt: { h1: "Escolha qualquer lugar e duas datas. As contas ficam com a gente.", pillData: "Dados reais: NISAR GCOV, GUNW, SME2 · banda L", pillProto: "Protótipo",

  else if (hint) { st = t("stHint"); col = "#EAFE07"; txt = "#07173F"; head = pt ? `Sinal de mudança entre ${fd(s.d0)} e ${fd(s.d1)}: falta confirmação` : `Change signal between ${fd(s.d0)} and ${fd(s.d1)}: needs confirmation`; }
  else { st = t("stNone"); col = "#2E7D4F"; txt = "#fff"; head = pt ? `Nada mudou além do normal entre ${fd(s.d0)} e ${fd(s.d1)}` : `Nothing changed beyond normal between ${fd(s.d0)} and ${fd(s.d1)}`; }
  if (s.lowTracks.size) B.push(pt ? `${nf(s.cohMin ?? s.cohMax, 0)} a ${nf(s.cohMax, 0)}% da área perdeu a coerência (abaixo de 0,3) nos pares de interferometria do período, vistos por ${s.lowTracks.size} trilho(s). Em períodos calmos, fica abaixo de 10%.` : `${(s.cohMin ?? s.cohMax).toFixed(0)} to ${s.cohMax.toFixed(0)}% of the area lost coherence (below 0.3) in the period's interferometric pairs, seen by ${s.lowTracks.size} track(s). In calm periods it stays under 10%.`);
  else if (s.pairs.length) B.push(pt ? `A coerência ficou alta nos ${s.pairs.length} pares de interferometria do período: o chão não foi perturbado.` : `Coherence stayed high in the period's ${s.pairs.length} interferometric pairs: the ground was not disturbed.`);
  if (s.hvOK) B.push(pt ? `${nf(s.vegHa, 0)} ha perderam pelo menos 3 dB no HV (estrutura da vegetação)${s.cen ? `, com centro perto de ${nf(s.cen[1], 3)}°, ${nf(s.cen[0], 3)}°` : ""}.` : `${s.vegHa.toFixed(0)} ha lost at least 3 dB in HV (vegetation structure)${s.cen ? `, centred near ${s.cen[1].toFixed(3)}°, ${s.cen[0].toFixed(3)}°` : ""}.`);
  else B.push(pt ? "Uma das datas só tem HH: a camada de vegetação não pode ser comparada neste par." : "One of the dates is HH-only: the vegetation layer cannot be compared for this pair.");
  if (s.wInHa + s.wOutHa > 0) B.push(pt ? `Água: ${nf(s.wInHa, 0)} ha alagaram e ${nf(s.wOutHa, 0)} ha secaram (HH abaixo de −18 dB).` : `Water: ${s.wInHa.toFixed(0)} ha flooded and ${s.wOutHa.toFixed(0)} ha dried out (HH below −18 dB).`);
  if (s.rain != null) { const dry = s.rain / Math.max(1, s.days) < 1.5; B.push(pt ? `Choveu ${nf(s.rain, 0)} mm em ${nf(s.days, 0)} dias (NASA POWER): ${dry ? "período seco, compatível com fogo ou secagem da vegetação" : "período úmido, compatível com alagamento ou vegetação acamada"}.` : `${s.rain.toFixed(0)} mm of rain in ${s.days.toFixed(0)} days (NASA POWER): ${dry ? "a dry spell, consistent with fire or drying vegetation" : "a wet spell, consistent with flooding or flattened vegetation"}.`); }
  if (s.hhMed != null) B.push(pt ? `O HH da área variou ${s.hhMed >= 0 ? "+" : ""}${nf(s.hhMed, 1)} dB (mediana): ${s.hhMed > 0.5 ? "solo mais úmido" : s.hhMed < -0.5 ? "solo mais seco" : "umidade do solo parecida"}.` : `Area HH changed ${s.hhMed >= 0 ? "+" : ""}${s.hhMed.toFixed(1)} dB (median): ${s.hhMed > 0.5 ? "wetter soil" : s.hhMed < -0.5 ? "drier soil" : "similar soil moisture"}.`);
  const nxt = strong ? (pt ? "Conferir na galeria a falsa cor do Landsat 9 depois desta data (cicatriz de fogo em marrom-avermelhado) e o par de coerência de setembro." : "Check the Landsat 9 false colour after this date in the gallery (burn scars in reddish-brown) and the September coherence pair.")
    : hint ? (pt ? "Ver os pares intermediários e outra direção de passagem antes de concluir." : "Look at the intermediate pairs and another pass direction before concluding.")
    : (pt ? "Escolher outro par de datas: o primeiro e o último sozinhos podem esconder o que aconteceu no meio." : "Pick another pair of dates: the first and last alone can hide what happened in between.");
  $("status").textContent = st; $("status").style.background = col; $("status").style.color = txt; $("resultado").style.borderTopColor = col;
  $("headline").textContent = head; $("bullets").innerHTML = B.map((b) => `<li>${esc(b)}</li>`).join(""); $("next").textContent = nxt;
}
function renderFicha() {
  $("fhead").innerHTML = [t("use"), t("when"), t("geoc"), t("col"), t("file")].map((h) => `<th>${esc(h)}</th>`).join("");

  $("fbody").innerHTML = S.geo.passagens_lista.map((p) => { const i = S.meta.datas.indexOf(p.data); const use = i === S.b ? t("before") : i === S.a ? t("after") : t("serie");
    return `<tr><td style="font-weight:700">${esc(use)}</td><td>${fd(p.data)}${p.hora_utc ? " " + esc(p.hora_utc) : ""}</td><td style="font-family:var(--mono)">${String(p.ciclo).padStart(3, "0")} · ${tr} · ${dir} · ${fr}</td><td>${esc((p.colecao || "").includes("PROVISIONAL") ? t("prov") : t("valid"))} (${esc(p.crid || "")})</td><td class="f">${esc(p.arquivo)}</td></tr>`; }).join("");
  $("fnote").textContent = t("fnote");
}
function renderGallery() {
  const g = S.area.galeria || []; const fig = (x) => `<figure><img src="data/${esc(x.arquivo)}" alt="${esc(lang === "pt" ? x.titulo_pt : x.titulo_en)}" loading="lazy" data-zoom><figcaption><b>${esc(lang === "pt" ? x.titulo_pt : x.titulo_en)}</b><span>${esc(lang === "pt" ? x.legenda_pt : x.legenda_en)}</span></figcaption><span class="src${x.grupo === "comparacao" ? " cmp" : ""}">${esc(x.fonte)}</span></figure>`;

}

// ---------- carrossel: NISAR + Planetary Computer, data a data
const CAR = { idx: null, dates: [], i: 0, layer: "s2nat", geo: {}, timer: null };
async function geoData(id) { if (CAR.geo[id]) return CAR.geo[id]; const g = S.area.geometrias.find((x) => x.id === id); if (!g) return null; const base = "data/" + g.pasta + "/";
  const meta = await getJSON(base + "app.json"); const [hv, hh] = await Promise.all([getU8(base + "hv_u8.png"), getU8(base + "hh_u8.png")]); return (CAR.geo[id] = { meta, hv, hh }); }
function drawGeo(cv, G, k) { const [, H, W] = G.meta.forma, n = H * W; cv.width = W; cv.height = H; const ctx = cv.getContext("2d"); const im = ctx.createImageData(W, H); const d = im.data;
  let c = 0; for (let i = 0; i < n; i += 97) if (G.hv[k * n + i]) c++; const useHH = c <= 5; const arr = useHH ? G.hh : G.hv; const [l, h] = useHH ? [-22, 0] : [-26, -8];
  for (let i = 0; i < n; i++) { const u = arr[k * n + i]; const o = i * 4; d[o + 3] = 255; if (!u) continue; const v = Math.max(0, Math.min(255, ((dB(u) - l) / (h - l)) * 255)); d[o] = d[o + 1] = d[o + 2] = v; }
  ctx.putImageData(im, 0, 0); return useHH; }
const LAYERS = [["s2nat", "s2", "natural"], ["s2brn", "s2", "queimada"], ["s1", "s1", "radar"], ["lst", "landsat", "temperatura"]];
async function renderCarousel() {
  if (!CAR.dates.length) return; const r = CAR.dates[CAR.i]; $("carRange").value = CAR.i; $("carDate").textContent = fd(r.data_nisar);
  const gid = r.geometrias[0]; $("carGeo").textContent = `NISAR · ${geoName(gid)}`;
  const G = await geoData(gid); if (G) { const k = G.meta.datas.indexOf(r.data_nisar); if (k >= 0) { const hh = drawGeo($("cvCar"), G, k); $("cvCar").title = hh ? "HH" : "HV"; } }
  const src = (L) => { const [, key, im] = LAYERS.find((x) => x[0] === L); const s = r[key]; return s && s.imagens && s.imagens[im] ? { s, url: "data/" + CAR.base + s.imagens[im] } : null; };
  if (!src(CAR.layer)) { const f = LAYERS.find((x) => src(x[0])); if (f) CAR.layer = f[0]; }
  const cur = src(CAR.layer); const top = $("carTop");
  if (cur) { top.hidden = false; top.src = cur.url; top.alt = t(CAR.layer); $("carLabR").textContent = `${t(CAR.layer).split(" · ")[0]} ${fd(cur.s.data)}`; $("carLabR").hidden = false; }
  else { top.hidden = true; $("carLabR").hidden = true; }
  swipe();
  $("carThumbs").innerHTML = LAYERS.map(([L, key]) => { const x = src(L); const win = { s2: 5, landsat: 8, s1: 6 }[key];
    return `<button type="button" data-cl="${L}" aria-pressed="${L === CAR.layer && !!x}"${x ? "" : " disabled"}>${x ? `<img src="${x.url}" alt="${esc(t(L))}" loading="lazy">` : `<div class="ph">${esc(CAR.idx ? `${t("carNone")} ±${win} ${t("days")}` : t("carWait"))}</div>`}
      <b>${esc(t(L))}</b><span>${x ? `${fd(x.s.data)} · ${x.s.dias === 0 ? (lang === "pt" ? "mesmo dia" : "same day") : `±${x.s.dias} ${t("days")}`}${x.s.nuvem_area != null ? ` · ${lang === "pt" ? "nuvem" : "cloud"} ${nf(x.s.nuvem_area * 100, 0)}%` : ""}` : "–"}</span></button>`; }).join("");
  $("carThumbs").querySelectorAll("[data-cl]").forEach((b) => b.addEventListener("click", () => { CAR.layer = b.dataset.cl; renderCarousel(); }));
  const M = [[t("mNdvi"), r.s2?.ndvi_mediana ?? r.landsat?.ndvi_mediana, (v) => nf(v, 2)], [t("mBurn"), r.s2?.queimada_pct, (v) => nf(v, 1) + "%"], [t("mWater"), r.s2?.agua_pct, (v) => nf(v, 1) + "%"],
    [t("mLst"), r.landsat?.temperatura_mediana_c, (v) => nf(v, 1) + " °C"], [t("mVh"), r.s1?.vh_mediana_db, (v) => nf(v, 1) + " dB"]];
  $("carMetrics").innerHTML = M.map(([k, v, f]) => `<div><small>${esc(k)}</small><b>${v == null ? "–" : esc(f(v))}</b></div>`).join("");
}
function swipe() { const p = +$("carSwipe").value; $("carTop").style.clipPath = `inset(0 0 0 ${p}%)`; $("carBar").style.left = `calc(${p}% - 1px)`; $("carBar").hidden = $("carTop").hidden; }
$("carSwipe").addEventListener("input", swipe);
$("carRange").addEventListener("input", (e) => { CAR.i = +e.target.value; renderCarousel(); });
$("carPrev").addEventListener("click", () => { CAR.i = (CAR.i - 1 + CAR.dates.length) % CAR.dates.length; renderCarousel(); });
$("carNext").addEventListener("click", () => { CAR.i = (CAR.i + 1) % CAR.dates.length; renderCarousel(); });
$("carPlay").addEventListener("click", () => { if (CAR.timer) { clearInterval(CAR.timer); CAR.timer = null; $("carPlay").textContent = t("play"); return; }
  $("carPlay").textContent = t("pause"); CAR.timer = setInterval(() => { CAR.i = (CAR.i + 1) % CAR.dates.length; renderCarousel(); }, 1600); });
async function initCarousel() {
  if (S.area.carrossel) { try { CAR.idx = await getJSON("data/" + S.area.carrossel); CAR.base = S.area.carrossel.replace(/[^/]+$/, ""); CAR.dates = CAR.idx.datas; } catch (e) { CAR.idx = null; } }
  if (!CAR.dates.length) { const m = {}; S.area.geometrias.forEach((g) => g.passagens_lista.forEach((p) => { (m[p.data] = m[p.data] || []).push(g.id); }));
    CAR.dates = Object.keys(m).sort().map((d) => ({ data_nisar: d, geometrias: m[d] })); }
  $("carRange").max = CAR.dates.length - 1; CAR.i = Math.max(0, CAR.dates.findIndex((r) => r.data_nisar === (S.R.par_inicial || [])[1])); renderCarousel();
}

["cvArea", "cvB", "cvAf", "cvC"].forEach((id) => $(id).addEventListener("click", (e) => { const r = e.currentTarget.getBoundingClientRect(); const [, H, W] = S.meta.forma;
  S.pix = [Math.min(W - 1, Math.floor((e.clientX - r.left) / r.width * W)), Math.min(H - 1, Math.floor((e.clientY - r.top) / r.height * H))]; placeMarks(); renderPix(); }));
$("draw").addEventListener("click", () => { $("drawmsg").textContent = t("drawMsg"); });
$("geo").addEventListener("change", (e) => loadGeo(e.target.value));
$("csvbtn").addEventListener("click", async () => { const [tr, d, f] = S.geo.id.split("_"); const rows = [["date", "track", "direction", "frame", "collection", "crid", "file"]].concat(S.geo.passagens_lista.map((p) => [p.data, tr, d, f, p.colecao, p.crid, p.arquivo]));
  try { await navigator.clipboard.writeText(rows.map((r) => r.join(",")).join("\n")); $("csvmsg").textContent = t("copied"); } catch (e) { $("csvmsg").textContent = t("copyFail"); } });
["pt", "en"].forEach((l) => $("l-" + l).addEventListener("click", () => { lang = l; try { localStorage.setItem("dl-lang", l); } catch (e) {} renderStatic(); if (S.meta) renderPair(); if (CAR.dates.length) { $("carPlay").textContent = t(CAR.timer ? "pause" : "play"); renderCarousel(); } }));

async function loadGeo(id) {
  S.geo = S.area.geometrias.find((g) => g.id === id) || S.area.geometrias[0]; const base = "data/" + S.geo.pasta + "/";
  S.meta = await getJSON(base + "app.json"); [S.hv, S.hh] = await Promise.all([getU8(base + "hv_u8.png"), getU8(base + "hh_u8.png")]);
  const ds = S.meta.datas; const pi = S.R.par_inicial || []; let b = ds.indexOf(pi[0]), a = ds.indexOf(pi[1]);
  if (b < 0 || a < 0 || a <= b) { b = Math.max(0, ds.length - 2); a = ds.length - 1; }
  S.b = b; S.a = a;
  if (S.R.area_ponto) { const p = llToPix(S.R.area_ponto.lon, S.R.area_ponto.lat); const [, H, W] = S.meta.forma; S.pix = p[0] >= 0 && p[1] >= 0 && p[0] < W && p[1] < H ? p : null; }
  renderStatic(); renderPair();
}
(async () => {
  renderStatic();
  const regs = await getJSON("data/regioes.json"); S.R = regs.find((r) => r.area) || regs[0]; S.area = S.R.area;
  $("jsonlink").href = "data/regioes.json";
  if (S.area.coerencia) { try { S.coh = await getU8("data/" + S.area.coerencia); } catch (e) {} }
  await loadGeo(S.area.geometrias[0].id);
  await initCarousel();
})();
